<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#f7f3ee" />
<title>Nick Life 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f7f3ee; --card:#fffdfa; --ink:#292722; --muted:#7e786f; --line:#e9e1d7;
  --sage:#567c63; --sage-soft:#e9f0e9; --clay:#aa6d55; --clay-soft:#f7ebe5;
  --blue:#546e89; --blue-soft:#eaf0f6; --gold:#a6843f; --gold-soft:#f7f0dc;
  --plum:#74637f; --plum-soft:#f0ebf3; --shadow:0 10px 30px rgba(54,44,36,.07);
  --safe-bottom:max(18px, env(safe-area-inset-bottom));
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(86px + var(--safe-bottom))}
button,input{font:inherit}.app{max-width:520px;margin:0 auto;min-height:100vh}.screen{display:none;padding:0 18px 30px}.screen.active{display:block}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 82%,rgba(247,243,238,0));padding:18px 0 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}.title{font-family:'DM Serif Display',serif;font-size:34px;line-height:1.02;margin-top:3px}.subtitle{font-size:13px;color:var(--muted);margin-top:4px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:14px;display:grid;place-items:center;color:var(--muted);box-shadow:0 4px 16px rgba(54,44,36,.04);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}.pad{padding:17px}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:24px 2px 9px}.section-title:first-child{margin-top:4px}
.hero{padding:20px;border-radius:26px;background:linear-gradient(145deg,#fffaf4,#eef4ed);border:1px solid #e1e6df;box-shadow:var(--shadow);margin-bottom:14px}.hero-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.hero h2{font:italic 29px/1.05 'DM Serif Display',serif;margin:5px 0 8px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.score{font:italic 34px/1 'DM Serif Display',serif;color:var(--sage)}
.pill-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.pill{font-size:11px;font-weight:700;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.68);border:1px solid rgba(86,124,99,.18);color:var(--sage)}
.direction{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.dir-card{padding:13px 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);min-height:112px}.dir-icon{font-size:22px}.dir-name{font-weight:700;font-size:12px;margin-top:10px}.dir-sub{color:var(--muted);font-size:10px;line-height:1.35;margin-top:3px}
.focus-card{padding:18px;background:var(--ink);color:#fff;border-radius:22px;margin-bottom:14px}.focus-label{color:#d5cfc6;font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:700}.focus-text{font:italic 23px/1.15 'DM Serif Display',serif;margin:8px 0 14px}.focus-actions{display:flex;gap:8px}.focus-actions button{border:none;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer}.focus-done{background:#fff;color:var(--ink)}.focus-skip{background:rgba(255,255,255,.12);color:#fff}
.task{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{width:23px;height:23px;border-radius:50%;border:1.5px solid #cfc6ba;background:#fff;flex:0 0 23px;display:grid;place-items:center;cursor:pointer;margin-top:1px}.check.done{background:var(--sage);border-color:var(--sage);color:#fff}.task-copy{min-width:0;flex:1}.task-text{font-size:13px;line-height:1.4}.task-text.done{text-decoration:line-through;color:var(--muted)}.task-meta{font-size:10px;color:var(--muted);margin-top:3px}.task-more{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 4px}
.quick-add{display:flex;gap:8px;margin-top:10px}.quick-add input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;outline:none}.quick-add button{border:0;border-radius:13px;background:var(--ink);color:#fff;padding:10px 14px;font-weight:700}
.habit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.habit{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px;cursor:pointer;position:relative;min-height:102px}.habit.active{border-color:rgba(86,124,99,.35);background:var(--sage-soft)}.habit .emoji{font-size:21px}.habit-name{font-size:12px;font-weight:700;margin-top:10px}.habit-note{font-size:10px;color:var(--muted);line-height:1.35;margin-top:3px}.habit-state{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px}.habit.active .habit-state{background:var(--sage);color:#fff;border-color:var(--sage)}
.trip{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.trip:last-child{border-bottom:0}.datebox{width:48px;height:52px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 48px}.datebox b{font-size:17px;line-height:1}.datebox span{font-size:9px;text-transform:uppercase;font-weight:700;margin-top:3px}.trip-title{font-size:13px;font-weight:700}.trip-sub{font-size:10px;color:var(--muted);margin-top:3px}.days-away{margin-left:auto;font-size:10px;font-weight:700;color:var(--blue)}
.life-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.life-card{border-radius:22px;padding:16px;border:1px solid var(--line);min-height:148px;cursor:pointer}.life-card:nth-child(1){background:var(--sage-soft)}.life-card:nth-child(2){background:var(--clay-soft)}.life-card:nth-child(3){background:var(--blue-soft)}.life-card:nth-child(4){background:var(--plum-soft)}.life-card:nth-child(5){background:var(--gold-soft)}.life-card:nth-child(6){background:#f1eeee}.life-card .emoji{font-size:27px}.life-card h3{font:italic 20px/1.05 'DM Serif Display',serif;margin:19px 0 5px}.life-card p{font-size:10px;color:var(--muted);line-height:1.4;margin:0}.life-stat{font-size:11px;font-weight:700;margin-top:12px}
.plan-tabs{display:flex;gap:6px;background:#eee7de;padding:4px;border-radius:15px;margin-bottom:14px;overflow:auto}.plan-tab{white-space:nowrap;flex:1;border:0;background:none;border-radius:11px;padding:8px 9px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}.plan-tab.active{background:var(--card);color:var(--ink);box-shadow:0 3px 10px rgba(54,44,36,.06)}.plan-panel{display:none}.plan-panel.active{display:block}
.project{padding:14px 0;border-bottom:1px solid var(--line)}.project:last-child{border-bottom:0}.project-row{display:flex;align-items:center;gap:9px}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--sage)}.status-dot.hold{background:var(--gold)}.status-dot.done{background:var(--blue)}.project-name{font-size:13px;font-weight:700;flex:1}.project-notes{font-size:10px;line-height:1.45;color:var(--muted);white-space:pre-wrap;margin:6px 0 0 17px}.reminder{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.reminder:last-child{border-bottom:0}.reminder-dot{width:10px;height:10px;border-radius:50%;margin-top:4px}.reminder b{font-size:13px}.reminder span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.progress-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.metric-card{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}.metric-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.metric-value{font:italic 31px/1 'DM Serif Display',serif;margin-top:8px}.metric-sub{font-size:10px;color:var(--muted);margin-top:6px}.weightbar{height:7px;border-radius:20px;background:#eee6dd;margin-top:13px;overflow:hidden}.weightbar>div{height:100%;background:var(--sage);border-radius:20px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.daycol{text-align:center}.dayname{font-size:9px;color:var(--muted);margin-bottom:6px}.daydot{width:100%;aspect-ratio:1;border-radius:12px;background:#efe9e2;display:grid;place-items:center;font-size:11px;color:var(--muted)}.daydot.good{background:var(--sage-soft);color:var(--sage);font-weight:700}.daydot.today{outline:2px solid var(--ink);outline-offset:1px}
.habit-summary{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.habit-summary:last-child{border-bottom:0}.habit-summary b{font-size:12px}.habit-summary span{font-size:11px;color:var(--muted)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,253,250,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px var(--safe-bottom)}.bottom-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav-btn{border:0;background:none;color:#9a938a;padding:7px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;font-weight:700;cursor:pointer}.nav-btn .nav-icon{font-size:20px}.nav-btn.active{color:var(--ink)}
.toast{position:fixed;bottom:108px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-top:6px}.sync-dot{width:7px;height:7px;border-radius:50%;background:#aaa}.sync-dot.ok{background:#5c9b6c}.sync-dot.busy{background:#c6963e}.sync-dot.bad{background:#bd5b4b}
.empty{padding:18px 0;color:var(--muted);font-size:12px;text-align:center}.tiny-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer}
.drawer{position:fixed;inset:0;background:rgba(30,27,24,.42);z-index:200;display:none;align-items:flex-end}.drawer.show{display:flex}.drawer-card{width:min(520px,100%);margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + var(--safe-bottom));max-height:82vh;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-title{font:italic 26px/1 'DM Serif Display',serif}.close{border:0;background:var(--card);border:1px solid var(--line);width:34px;height:34px;border-radius:12px;font-size:18px}
@media (max-width:380px){.direction{grid-template-columns:1fr}.dir-card{min-height:0}.life-grid{grid-template-columns:1fr}.habit-grid{grid-template-columns:1fr 1fr}.progress-hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <section id="screen-now" class="screen active"></section>
  <section id="screen-life" class="screen"></section>
  <section id="screen-plan" class="screen"></section>
  <section id="screen-progress" class="screen"></section>
</div>
<nav class="bottom-nav"><div class="bottom-inner">
  <button class="nav-btn active" data-screen="now" onclick="go('now')"><span class="nav-icon">◉</span><span>NOW</span></button>
  <button class="nav-btn" data-screen="life" onclick="go('life')"><span class="nav-icon">♡</span><span>LIFE</span></button>
  <button class="nav-btn" data-screen="plan" onclick="go('plan')"><span class="nav-icon">⌁</span><span>PLAN</span></button>
  <button class="nav-btn" data-screen="progress" onclick="go('progress')"><span class="nav-icon">↗</span><span>PROGRESS</span></button>
</div></nav>
<div id="toast" class="toast"></div>
<div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><div class="drawer-card"><div class="drawer-head"><div class="drawer-title" id="drawer-title">Details</div><button class="close" onclick="closeDrawer()">×</button></div><div id="drawer-body"></div></div></div>
<script>
const SB_URL='https://bhnupipukgotsecawnhl.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJobnVwaXB1a2dvdHNlY2F3bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzUyNTAsImV4cCI6MjA5NjUxMTI1MH0.HPgjzZK2Ow-45kbD8DFvM5cMPaVqnuhc1tCv7wvFlOg';
const SB_TABLE='nl_sync';
let sb=null, syncState='offline', activePlan='tasks';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parse=(x,f)=>{try{return JSON.parse(x)}catch(e){return f}};
const local=(k,f)=>parse(localStorage.getItem(k)||'',f);
let S={
  checklists:local('nl_checklists',{}), hobbies:local('nl_hobbies',[]), trips:local('nl_trips',[]), neighbors:local('nl_neighbors',[]),
  routines:local('nl_routines',{}), customRoutines:local('nl_customRoutines',[]), taskCategories:local('nl_taskCategories',[]), metrics:local('nl_metrics',[]),
  career:local('nl_career',{wins:[],goals:[],notes:[]}), food:local('nl_food',{}), entries:local('nl_entries',[]), reminders:local('nl_reminders',[]), projects:local('nl_projects',[]),
  skincare:local('nl_skincare',{}), notesTasks:local('nl_notes_tasks',[])
};
let daily=local('nl_daily',{morning:[],today:[],afternoon:[],evening:[],weekend:[]});
let oneoff=local('nl_oneoff',[]); let control=local('nl_control',{date:todayStr(),items:{},sliders:{}}); let controlConfig=local('nl_control_config',{items:[],sliders:[]});
let streaks=local('nl_streaks',{}); let v2=local('nl_v2habits',{days:{}}); if(!v2.days)v2.days={}; if(!v2.days[todayStr()])v2.days[todayStr()]={};
const HABITS=[
 {id:'movement',emoji:'🚶',name:'Move my body',note:'Walk, yard, garden, workout — it all counts'},
 {id:'nutrition',emoji:'🥗',name:'Eat intentionally',note:'One better choice is still a better day'},
 {id:'alcohol',emoji:'🍃',name:'Alcohol plan',note:'Alcohol-free or stayed within today’s plan'},
 {id:'vaping',emoji:'🌬️',name:'Vape plan',note:'Delayed, reduced, or skipped an automatic vape'},
 {id:'water',emoji:'💧',name:'Water',note:'Started hydrated and kept it going'},
 {id:'recovery',emoji:'🧠',name:'Me time',note:'Protected time to decompress or recharge'}
];
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function setSync(s){syncState=s;document.querySelectorAll('.sync-dot').forEach(x=>{x.className='sync-dot '+(s==='synced'?'ok':s==='syncing'?'busy':s==='error'?'bad':'')});document.querySelectorAll('.sync-label').forEach(x=>x.textContent=s==='synced'?'Live data synced':s==='syncing'?'Syncing…':s==='error'?'Sync issue':'Offline')}
async function syncRaw(key,value){localStorage.setItem('nl_last_write',new Date().toISOString()); if(!sb)return; setSync('syncing');try{const {error}=await sb.from(SB_TABLE).upsert({key,value:JSON.stringify(value),updated_at:new Date().toISOString()});if(error)throw error;setSync('synced')}catch(e){console.error(e);setSync('error')}}
function cacheRow(key,val){
 if(key==='_daily'){daily=val;localStorage.setItem('nl_daily',JSON.stringify(val))}
 else if(key==='_oneoff'){oneoff=val;localStorage.setItem('nl_oneoff',JSON.stringify(val))}
 else if(key==='_control'){control=val;localStorage.setItem('nl_control',JSON.stringify(val))}
 else if(key==='_controlConfig'){controlConfig=val;localStorage.setItem('nl_control_config',JSON.stringify(val))}
 else if(key==='_streaks'){streaks=val;localStorage.setItem('nl_streaks',JSON.stringify(val))}
 else if(key==='_skincare'){S.skincare=val;localStorage.setItem('nl_skincare',JSON.stringify(val))}
 else if(key==='_notesTasks'){S.notesTasks=val;localStorage.setItem('nl_notes_tasks',JSON.stringify(val))}
 else if(key==='_v2habits'){v2=val||{days:{}};if(!v2.days)v2.days={};localStorage.setItem('nl_v2habits',JSON.stringify(v2))}
 else if(Object.prototype.hasOwnProperty.call(S,key)){S[key]=val;localStorage.setItem('nl_'+key,JSON.stringify(val))}
}
async function initSupabase(){setSync('syncing');try{sb=window.supabase.createClient(SB_URL,SB_KEY);const {data,error}=await sb.from(SB_TABLE).select('key,value,updated_at');if(error)throw error;(data||[]).forEach(r=>cacheRow(r.key,parse(r.value,null)));if(!v2.days[todayStr()])v2.days[todayStr()]={};renderAll();setSync('synced');
 try{sb.channel('nick-life-v2').on('postgres_changes',{event:'*',schema:'public',table:SB_TABLE},p=>{if(p.new?.key){cacheRow(p.new.key,parse(p.new.value,null));renderAll()}}).subscribe()}catch(e){}
 }catch(e){console.error(e);setSync('error');renderAll()}}
function go(name){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+name));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));window.scrollTo({top:0,behavior:'smooth'})}
function topbar(title,sub){return `<div class="topbar"><div><div class="eyebrow">Nick Life 2.0</div><div class="title">${title}</div><div class="subtitle">${sub}</div><div class="sync"><span class="sync-dot ${syncState==='synced'?'ok':syncState==='syncing'?'busy':syncState==='error'?'bad':''}"></span><span class="sync-label">${syncState==='synced'?'Live data synced':syncState==='syncing'?'Syncing…':syncState==='error'?'Sync issue':'Offline'}</span></div></div><button class="icon-btn" onclick="showAbout()">•••</button></div>`}
function dayGreeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function fmtDate(d){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(d)}
function allTodayTasks(){let a=[];(daily.today||[]).forEach(t=>a.push({...t,_src:'today'}));(daily.afternoon||[]).forEach(t=>a.push({...t,_src:'afternoon'}));(oneoff||[]).filter(t=>!t.done).forEach(t=>a.push({...t,_src:'oneoff'}));return a}
function taskMeta(src){return src==='afternoon'?'Afternoon':src==='oneoff'?'To-do':'Today'}
function toggleTask(src,id){let arr=src==='oneoff'?oneoff:(daily[src]||[]);const t=arr.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(src==='oneoff'){localStorage.setItem('nl_oneoff',JSON.stringify(oneoff));syncRaw('_oneoff',oneoff)}else{localStorage.setItem('nl_daily',JSON.stringify(daily));syncRaw('_daily',daily)}renderAll()}
function addToday(){const i=document.getElementById('quick-task');const txt=i?.value.trim();if(!txt)return;if(!daily.today)daily.today=[];daily.today.push({id:uid(),text:txt,done:false});localStorage.setItem('nl_daily',JSON.stringify(daily));syncRaw('_daily',daily);i.value='';renderAll();toast('Added to today')}
function habitOn(id,date=todayStr()){return !!v2.days?.[date]?.[id]}
function toggleHabit(id){const d=todayStr();v2.days[d]=v2.days[d]||{};v2.days[d][id]=!v2.days[d][id];localStorage.setItem('nl_v2habits',JSON.stringify(v2));syncRaw('_v2habits',v2);if(['movement','water','recovery'].includes(id)){control.date=d;control.items=control.items||{};control.items[id]=v2.days[d][id]?'yes':undefined;localStorage.setItem('nl_control',JSON.stringify(control));syncRaw('_control',control)}renderAll()}
function habitScore(date=todayStr()){const o=v2.days?.[date]||{};return HABITS.filter(h=>o[h.id]).length}
function nextTrips(){const now=new Date();now.setHours(0,0,0,0);return (S.trips||[]).filter(t=>t.date&&new Date(t.date+'T12:00:00')>=now).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4)}
function daysAway(s){const a=new Date();a.setHours(0,0,0,0);const b=new Date(s+'T12:00:00');return Math.ceil((b-a)/86400000)}
function tripHtml(t){const d=new Date(t.date+'T12:00:00');const away=daysAway(t.date);return `<div class="trip" onclick="showTrip('${t.id}')"><div class="datebox"><b>${d.getDate()}</b><span>${d.toLocaleString('en-US',{month:'short'})}</span></div><div><div class="trip-title">${esc(t.title)}</div><div class="trip-sub">${esc(t.location||'Location TBD')} · ${esc(t.who||'Plans')}</div></div><div class="days-away">${away===0?'today':away===1?'tomorrow':away+'d'}</div></div>`}
function renderNow(){const tasks=allTodayTasks();const undone=tasks.filter(t=>!t.done);const focus=undone[0];const score=habitScore();const trips=nextTrips();const day=new Date();document.getElementById('screen-now').innerHTML=topbar('Now',fmtDate(day))+`
<div class="hero"><div class="hero-row"><div><div class="eyebrow">${dayGreeting()}, Nick</div><h2>Build the life, not just the list.</h2><p>Today only needs to move you a little closer to healthy, ready, and fulfilled.</p></div><div><div class="score">${score}/6</div><div style="font-size:9px;color:var(--muted);text-align:right;margin-top:3px">lifestyle today</div></div></div><div class="pill-row"><span class="pill">Family</span><span class="pill">Health</span><span class="pill">Career</span></div></div>
<div class="section-title">Your direction</div><div class="direction"><div class="dir-card"><div class="dir-icon">👨‍👨‍👧‍👦</div><div class="dir-name">Family</div><div class="dir-sub">Prepare your home, routines and health for adoption.</div></div><div class="dir-card"><div class="dir-icon">❤️</div><div class="dir-name">Health</div><div class="dir-sub">Less alcohol & vaping. Better food. Sustainable movement.</div></div><div class="dir-card"><div class="dir-icon">💼</div><div class="dir-name">Career</div><div class="dir-sub">Keep learning, leading and building confidence.</div></div></div>
${focus?`<div class="section-title">If I only do one thing</div><div class="focus-card"><div class="focus-label">Best next move</div><div class="focus-text">${esc(focus.text)}</div><div class="focus-actions"><button class="focus-done" onclick="toggleTask('${focus._src}','${focus.id}')">Mark done</button><button class="focus-skip" onclick="cycleFocus('${focus.id}')">Show another</button></div></div>`:''}
<div class="section-title">Today</div><div class="card"><div class="pad">${tasks.length?tasks.slice(0,8).map(t=>`<div class="task"><button class="check ${t.done?'done':''}" onclick="toggleTask('${t._src}','${t.id}')">${t.done?'✓':''}</button><div class="task-copy"><div class="task-text ${t.done?'done':''}">${esc(t.text)}</div><div class="task-meta">${taskMeta(t._src)}</div></div></div>`).join(''):'<div class="empty">Nothing demanding your attention. Nice.</div>'}<div class="quick-add"><input id="quick-task" placeholder="Add something for today…" onkeydown="if(event.key==='Enter')addToday()"><button onclick="addToday()">Add</button></div></div></div>
<div class="section-title">Lifestyle — direction, not perfection</div><div class="habit-grid">${HABITS.map(h=>`<div class="habit ${habitOn(h.id)?'active':''}" onclick="toggleHabit('${h.id}')"><div class="habit-state">${habitOn(h.id)?'✓':''}</div><div class="emoji">${h.emoji}</div><div class="habit-name">${h.name}</div><div class="habit-note">${h.note}</div></div>`).join('')}</div>
<div class="section-title">Coming up</div><div class="card"><div class="pad">${trips.length?trips.map(tripHtml).join(''):'<div class="empty">Nothing scheduled yet.</div>'}</div></div>`}
let focusOffset=0;function cycleFocus(){focusOffset++;const list=allTodayTasks().filter(t=>!t.done);if(list.length<2)return;const t=list[focusOffset%list.length];document.querySelector('.focus-text').textContent=t.text;const b=document.querySelector('.focus-done');b.setAttribute('onclick',`toggleTask('${t._src}','${t.id}')`)}
function renderLife(){const activeProjects=(S.projects||[]).filter(p=>p.status!=='done').length;const hobbyOpen=(S.hobbies||[]).length;const healthItems=HABITS.length;const careerGoals=S.career?.goals?.length||0;const upcoming=nextTrips().length;document.getElementById('screen-life').innerHTML=topbar('Life','Everything has a home — without living on your home screen.')+`<div class="life-grid">
<div class="life-card" onclick="showLife('health')"><div class="emoji">❤️</div><h3>Health & Me</h3><p>Nutrition, movement, weight, self-care, alcohol, vaping and doctor-led health goals.</p><div class="life-stat">${healthItems} lifestyle signals</div></div>
<div class="life-card" onclick="showLife('home')"><div class="emoji">🏠</div><h3>Home</h3><p>House projects, maintenance, garden, upgrades and the stuff that makes home feel finished.</p><div class="life-stat">${activeProjects} active projects</div></div>
<div class="life-card" onclick="showLife('family')"><div class="emoji">👨‍👨‍👧‍👦</div><h3>Family</h3><p>Adoption readiness, shared plans, birthdays, family trips and future-family priorities.</p><div class="life-stat">North star</div></div>
<div class="life-card" onclick="showLife('career')"><div class="emoji">💼</div><h3>Career</h3><p>Wins, learning, confidence, leadership and the next version of your work life.</p><div class="life-stat">${careerGoals} goals</div></div>
<div class="life-card" onclick="showLife('hobbies')"><div class="emoji">🎮</div><h3>My Time</h3><p>Games, reading, gardening, birds, music — not rewards. Actual parts of your life.</p><div class="life-stat">${hobbyOpen} hobbies</div></div>
<div class="life-card" onclick="showLife('experiences')"><div class="emoji">✈️</div><h3>Experiences</h3><p>Trips, concerts, weddings, games and the things worth looking forward to.</p><div class="life-stat">${upcoming} coming up</div></div>
</div>`}
function planTab(n){activePlan=n;renderPlan()}
function renderPlan(){const tabs=[['tasks','Tasks'],['projects','Projects'],['trips','Trips'],['reminders','Reminders']];document.getElementById('screen-plan').innerHTML=topbar('Plan','Organize what is coming without carrying all of it today.')+`<div class="plan-tabs">${tabs.map(([id,l])=>`<button class="plan-tab ${activePlan===id?'active':''}" onclick="planTab('${id}')">${l}</button>`).join('')}</div>
<div class="plan-panel ${activePlan==='tasks'?'active':''}">${planTasks()}</div><div class="plan-panel ${activePlan==='projects'?'active':''}">${planProjects()}</div><div class="plan-panel ${activePlan==='trips'?'active':''}">${planTrips()}</div><div class="plan-panel ${activePlan==='reminders'?'active':''}">${planReminders()}</div>`}
function planTasks(){const cats=S.taskCategories||[];const notes=(S.notesTasks||[]).filter(t=>!t.done);const oo=(oneoff||[]).filter(t=>!t.done);return `<div class="card"><div class="pad"><div class="eyebrow">One-off to-dos</div>${[...oo,...notes].length?[...oo,...notes].slice(0,20).map(t=>`<div class="task"><button class="check" onclick="toggleOneOffCompat('${t.id}')"></button><div class="task-copy"><div class="task-text">${esc(t.text)}</div></div></div>`).join(''):'<div class="empty">No open one-off tasks.</div>'}</div></div>${cats.map(c=>`<div class="card"><div class="pad"><div class="eyebrow">${esc(c.title)}</div>${(c.tasks||[]).filter(t=>!t.done).map(t=>`<div class="task"><button class="check" onclick="toggleCat('${c.id}','${t.id}')"></button><div class="task-copy"><div class="task-text">${esc(t.text)}</div></div></div>`).join('')||'<div class="empty">All clear.</div>'}</div></div>`).join('')}`}
function toggleOneOffCompat(id){let t=oneoff.find(x=>x.id===id);if(t){t.done=!t.done;localStorage.setItem('nl_oneoff',JSON.stringify(oneoff));syncRaw('_oneoff',oneoff)}else{t=(S.notesTasks||[]).find(x=>x.id===id);if(t){t.done=!t.done;localStorage.setItem('nl_notes_tasks',JSON.stringify(S.notesTasks));syncRaw('_notesTasks',S.notesTasks)}}renderAll()}
function toggleCat(cid,id){const c=(S.taskCategories||[]).find(x=>x.id===cid);const t=c?.tasks?.find(x=>x.id===id);if(!t)return;t.done=!t.done;localStorage.setItem('nl_taskCategories',JSON.stringify(S.taskCategories));syncRaw('taskCategories',S.taskCategories);renderAll()}
function planProjects(){const p=S.projects||[];return `<div class="card"><div class="pad">${p.length?p.map(x=>`<div class="project"><div class="project-row"><span class="status-dot ${x.status==='hold'?'hold':x.status==='done'?'done':''}"></span><div class="project-name">${esc(x.name)}</div><span style="font-size:10px;color:var(--muted)">${esc(x.status||'active')}</span></div>${x.notes?`<div class="project-notes">${esc(x.notes)}</div>`:''}</div>`).join(''):'<div class="empty">No projects yet.</div>'}</div></div>`}
function planTrips(){return `<div class="card"><div class="pad">${(S.trips||[]).slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(tripHtml).join('')||'<div class="empty">No trips yet.</div>'}</div></div>`}
function planReminders(){return `<div class="card"><div class="pad">${(S.reminders||[]).map(r=>`<div class="reminder"><span class="reminder-dot" style="background:${esc(r.color||'#999')}"></span><div><b>${esc(r.title)}</b><span>${esc(r.due||'No due date')}</span></div></div>`).join('')||'<div class="empty">No reminders.</div>'}</div></div>`}
function metricVal(name){const m=(S.metrics||[]).find(x=>x.name?.toLowerCase()===name.toLowerCase());return m?Number(String(m.value).replace(/[^0-9.]/g,'')):null}
function last7(){const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');out.push({d,s})}return out}
function renderProgress(){const weight=metricVal('Weight'),goal=metricVal('Goal weight');const pct=weight&&goal?Math.max(0,Math.min(100,((weight-goal)/(Math.max(weight,goal)-goal||1))*100)):0;const days=last7();document.getElementById('screen-progress').innerHTML=topbar('Progress','Look for direction over time — not perfect days.')+`<div class="progress-hero"><div class="metric-card" onclick="editWeight()"><div class="metric-label">Current weight</div><div class="metric-value">${weight??'—'}${weight?' lb':''}</div><div class="metric-sub">Goal ${goal??'—'} lb · tap to update</div><div class="weightbar"><div style="width:${100-pct}%"></div></div></div><div class="metric-card"><div class="metric-label">This week</div><div class="metric-value">${days.reduce((n,x)=>n+habitScore(x.s),0)}</div><div class="metric-sub">positive lifestyle choices logged</div></div></div>
<div class="section-title">Last 7 days</div><div class="card"><div class="pad"><div class="week-grid">${days.map(x=>{const s=habitScore(x.s);return `<div class="daycol"><div class="dayname">${x.d.toLocaleString('en-US',{weekday:'narrow'})}</div><div class="daydot ${s>=3?'good':''} ${x.s===todayStr()?'today':''}">${s||'·'}</div></div>`}).join('')}</div></div></div>
<div class="section-title">Lifestyle trends</div><div class="card"><div class="pad">${HABITS.map(h=>{const n=days.filter(x=>habitOn(h.id,x.s)).length;return `<div class="habit-summary"><b>${h.emoji} ${h.name}</b><span>${n}/7 days</span></div>`}).join('')}</div></div>
<div class="section-title">Career momentum</div><div class="card"><div class="pad"><div class="eyebrow">Wins</div>${(S.career?.wins||[]).slice(-4).map(w=>`<div class="task"><div class="check done">✓</div><div class="task-copy"><div class="task-text">${esc(w.text)}</div></div></div>`).join('')||'<div class="empty">Add wins in the original app for now.</div>'}<div class="eyebrow" style="margin-top:18px">Current goals</div>${(S.career?.goals||[]).map(g=>`<div class="task"><div class="check"></div><div class="task-copy"><div class="task-text">${esc(g.text)}</div></div></div>`).join('')||'<div class="empty">No career goals.</div>'}</div></div>`}
function editWeight(){const current=metricVal('Weight');const n=prompt('Current weight',current??'');if(n===null||!n.trim())return;let m=(S.metrics||[]).find(x=>x.name?.toLowerCase()==='weight');if(!m){m={id:uid(),name:'Weight',value:n};S.metrics.push(m)}else m.value=n;localStorage.setItem('nl_metrics',JSON.stringify(S.metrics));syncRaw('metrics',S.metrics);renderAll();toast('Weight updated')}
function showTrip(id){const t=(S.trips||[]).find(x=>x.id===id);if(!t)return;openDrawer(t.title,`<div class="section-title">Trip details</div><div class="card"><div class="pad"><div class="habit-summary"><b>📅 Dates</b><span>${esc(t.date||'TBD')}${t.endDate?' – '+esc(t.endDate):''}</span></div><div class="habit-summary"><b>📍 Location</b><span>${esc(t.location||'TBD')}</span></div><div class="habit-summary"><b>👥 Who</b><span>${esc(t.who||'—')}</span></div><div class="habit-summary"><b>🏠 Stay</b><span>${esc(t.stay||'—')}</span></div><div class="habit-summary"><b>🚗 Travel</b><span>${esc(t.transport||'—')}</span></div></div></div>${t.notes?`<div class="section-title">Notes</div><div class="card"><div class="pad" style="white-space:pre-wrap;font-size:13px;line-height:1.55">${esc(t.notes)}</div></div>`:''}${(t.packing||[]).length?`<div class="section-title">Packing</div><div class="card"><div class="pad">${t.packing.map(p=>`<div class="task"><div class="check ${p.done?'done':''}">${p.done?'✓':''}</div><div class="task-copy"><div class="task-text ${p.done?'done':''}">${esc(p.text)}</div></div></div>`).join('')}</div></div>`:''}`)}
function showLife(type){if(type==='health'){openDrawer('Health & Me',`<div class="section-title">Lifestyle focus</div><div class="card"><div class="pad">${HABITS.map(h=>`<div class="habit-summary"><b>${h.emoji} ${h.name}</b><span>${habitOn(h.id)?'today ✓':'open'}</span></div>`).join('')}</div></div><div class="section-title">Your current routines</div><div class="card"><div class="pad">${Object.entries(S.routines||{}).map(([k,v])=>`<div style="margin-bottom:14px"><div class="eyebrow">${esc(k)}</div><div style="font-size:12px;line-height:1.5;margin-top:4px">${esc(v)}</div></div>`).join('')}</div></div><div class="section-title">Doctor-led program</div><div class="card"><div class="pad" style="font-size:12px;line-height:1.55;color:var(--muted)">A dedicated program area is ready to be added once you join. We can track appointments, goals, nutrition guidance, measurements and notes without turning this into a calorie-policing app.</div></div>`)}
else if(type==='home'){openDrawer('Home',planProjects())}
else if(type==='career'){openDrawer('Career',`<div class="section-title">Wins</div><div class="card"><div class="pad">${(S.career?.wins||[]).map(w=>`<div class="task"><div class="check done">✓</div><div class="task-copy"><div class="task-text">${esc(w.text)}</div></div></div>`).join('')}</div></div><div class="section-title">Goals</div><div class="card"><div class="pad">${(S.career?.goals||[]).map(g=>`<div class="task"><div class="check"></div><div class="task-copy"><div class="task-text">${esc(g.text)}</div></div></div>`).join('')}</div></div>`)}
else if(type==='hobbies'){openDrawer('My Time',`<div class="card"><div class="pad">${(S.hobbies||[]).map(h=>`<div class="project"><div class="project-row"><span style="font-size:20px">${esc(h.emoji||'✨')}</span><div class="project-name">${esc(h.name)}</div><span style="font-size:10px;color:var(--muted)">${(h.subs||[]).filter(x=>!x.done).length} ideas</span></div>${(h.subs||[]).filter(x=>!x.done).slice(0,3).map(x=>`<div class="project-notes">• ${esc(x.text)}</div>`).join('')}</div>`).join('')||'<div class="empty">No hobbies yet.</div>'}</div></div>`)}
else if(type==='experiences'){openDrawer('Experiences',planTrips())}
else {openDrawer('Family',`<div class="hero" style="margin-top:16px"><div class="eyebrow">North star</div><h2>Build a life ready for the family you want.</h2><p>This area can become the adoption hub: preparation, home readiness, documents, appointments, learning, family plans and milestones.</p></div><div class="card"><div class="pad"><div class="habit-summary"><b>❤️ Health foundation</b><span>in progress</span></div><div class="habit-summary"><b>🏠 Home & routine readiness</b><span>in progress</span></div><div class="habit-summary"><b>📋 Adoption process</b><span>ready to build</span></div></div></div>`)}}
function openDrawer(title,html){document.getElementById('drawer-title').textContent=title;document.getElementById('drawer-body').innerHTML=html;document.getElementById('drawer').classList.add('show')}
function closeDrawer(){document.getElementById('drawer').classList.remove('show')}
function showAbout(){openDrawer('About this version',`<div class="hero" style="margin-top:16px"><div class="eyebrow">Prototype</div><h2>Nick Life 2.0</h2><p>A separate interface built on top of your existing Supabase <b>nl_sync</b> data. It does not replace your original app.</p></div><div class="card"><div class="pad"><div class="habit-summary"><b>Data source</b><span>existing Supabase</span></div><div class="habit-summary"><b>Original data</b><span>preserved</span></div><div class="habit-summary"><b>New V2 habit history</b><span>_v2habits row</span></div><div class="habit-summary"><b>Design idea</b><span>Now · Life · Plan · Progress</span></div></div></div>`)}
function renderAll(){if(!v2.days)v2.days={};if(!v2.days[todayStr()])v2.days[todayStr()]={};renderNow();renderLife();renderPlan();renderProgress()}
renderAll();initSupabase();
</script>
</body>
</html>
