function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function setSync(s){syncState=s;document.querySelectorAll('.sync-dot').forEach(x=>x.className='sync-dot '+(s==='synced'?'ok':s==='syncing'?'busy':s==='error'?'bad':''));document.querySelectorAll('.sync-label').forEach(x=>x.textContent=s==='synced'?'Synced':s==='syncing'?'Syncing…':s==='error'?'Sync issue':'Offline')}
async function syncRaw(key,value){localStorage.setItem('nl_last_write',new Date().toISOString());if(!sb)return;setSync('syncing');try{const {error}=await sb.from(SB_TABLE).upsert({key,value:JSON.stringify(value),updated_at:new Date().toISOString()});if(error)throw error;setSync('synced')}catch(e){console.error(e);setSync('error')}}
function cacheRow(key,val){if(key==='_daily'){daily=val||daily;localStorage.setItem('nl_daily',JSON.stringify(daily))}else if(key==='_oneoff'){oneoff=val||[];localStorage.setItem('nl_oneoff',JSON.stringify(oneoff))}else if(key==='_control'){control=val||control;localStorage.setItem('nl_control',JSON.stringify(control))}else if(key==='_controlConfig'){controlConfig=val||controlConfig;localStorage.setItem('nl_control_config',JSON.stringify(controlConfig))}else if(key==='_streaks'){streaks=val||{};localStorage.setItem('nl_streaks',JSON.stringify(streaks))}else if(key==='_skincare'){S.skincare=val||{};localStorage.setItem('nl_skincare',JSON.stringify(S.skincare))}else if(key==='_notesTasks'){S.notesTasks=val||[];localStorage.setItem('nl_notes_tasks',JSON.stringify(S.notesTasks))}else if(key==='_v2habits'){v2=val||{days:{}};if(!v2.days)v2.days={};localStorage.setItem('nl_v2habits',JSON.stringify(v2))}else if(key==='_v4'){v4=val||{weekly:{},doctor:{status:'Considering',program:'',notes:''}};if(!v4.weekly)v4.weekly={};if(!v4.doctor)v4.doctor={status:'Considering',program:'',notes:''};localStorage.setItem('nl_v4',JSON.stringify(v4))}else if(Object.prototype.hasOwnProperty.call(S,key)){S[key]=val;localStorage.setItem('nl_'+key,JSON.stringify(val))}}
async function initSupabase(){setSync('syncing');try{sb=window.supabase.createClient(SB_URL,SB_KEY);const {data,error}=await sb.from(SB_TABLE).select('key,value,updated_at');if(error)throw error;(data||[]).forEach(r=>cacheRow(r.key,parse(r.value,null)));if(!v2.days[todayStr()])v2.days[todayStr()]={};renderAll();setSync('synced');try{sb.channel('nick-life-v3').on('postgres_changes',{event:'*',schema:'public',table:SB_TABLE},p=>{if(p.new?.key){cacheRow(p.new.key,parse(p.new.value,null));renderAll()}}).subscribe()}catch(e){}}catch(e){console.error(e);setSync('error');renderAll()}}
function go(name){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+name));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));window.scrollTo({top:0,behavior:'smooth'})}
function fmtDate(d){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(d)}function dayGreeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function taskPool(){const h=new Date().getHours(),out=[];const add=(arr,src)=>{(arr||[]).forEach(t=>out.push({...t,_src:src}))};if(h<12)add(daily.morning,'morning');if(h>=12&&h<17)add(daily.afternoon,'afternoon');if(h>=17)add(daily.evening,'evening');add(daily.today,'today');(oneoff||[]).filter(t=>!t.done).forEach(t=>out.push({...t,_src:'oneoff'}));return out}
function allDay(){let out=[];['morning','today','afternoon','evening'].forEach(k=>(daily[k]||[]).forEach(t=>out.push({...t,_src:k})));return out}
function toggleTask(src,id){let arr=src==='oneoff'?oneoff:(daily[src]||[]),t=arr.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(src==='oneoff'){localStorage.setItem('nl_oneoff',JSON.stringify(oneoff));syncRaw('_oneoff',oneoff)}else{localStorage.setItem('nl_daily',JSON.stringify(daily));syncRaw('_daily',daily)}renderAll()}
function addToday(){const i=document.getElementById('quick-task');const txt=i?.value.trim();if(!txt)return;(daily.today||(daily.today=[])).push({id:uid(),text:txt,done:false});localStorage.setItem('nl_daily',JSON.stringify(daily));syncRaw('_daily',daily);renderAll();toast('Added')}
function habitOn(id,date=todayStr()){return !!v2.days?.[date]?.[id]}function toggleHabit(id){const d=todayStr();v2.days[d]=v2.days[d]||{};v2.days[d][id]=!v2.days[d][id];localStorage.setItem('nl_v2habits',JSON.stringify(v2));syncRaw('_v2habits',v2);renderAll()}function habitScore(date=todayStr()){return HABITS.filter(h=>habitOn(h.id,date)).length}
function nextTrips(){const n=new Date();n.setHours(0,0,0,0);return(S.trips||[]).filter(t=>t.date&&new Date(t.date+'T12:00:00')>=n).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6)}function daysAway(s){const a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(s+'T12:00:00')-a)/86400000)}
function phase(){const h=new Date().getHours();return h<11?'Morning':h<16?'Daytime':h<20?'Evening':'Tonight'}

function weekKey(){const d=new Date(),day=d.getDay(),sun=new Date(d);sun.setDate(d.getDate()-day);return sun.getFullYear()+'-'+String(sun.getMonth()+1).padStart(2,'0')+'-'+String(sun.getDate()).padStart(2,'0')}
function weeklyData(){return v4.weekly[weekKey()]||{priorities:[],note:'',resetDone:false}}
function saveV4(){localStorage.setItem('nl_v4',JSON.stringify(v4));syncRaw('_v4',v4)}
function forYou(){const out=[],next=nextTrips()[0],pool=taskPool().filter(t=>!t.done);if(next&&daysAway(next.date)<=7){const notes=(next.notes||'').toLowerCase();let detail=daysAway(next.date)===0?'Happening today':daysAway(next.date)===1?'Tomorrow':daysAway(next.date)+' days away';if(notes.includes('outfit'))detail+=' · outfit planning is still in your notes';out.push({icon:'✈️',title:next.title,sub:detail,action:'Open',fn:`showTrip('${next.id}')`})}const keywords=[['birthday','🎁'],['chiefs','🏈'],['pto','💼'],['pack','🧳'],['doctor','♥'],['health','♥']];for(const [k,ic] of keywords){const t=pool.find(x=>String(x.text).toLowerCase().includes(k));if(t&&!out.some(x=>x.title===t.text)){out.push({icon:ic,title:t.text,sub:'This is sitting in your open tasks.',action:'Do today',fn:`focusTask('${t._src}','${t.id}')`});if(out.length>=3)break}}if(out.length<3){const p=(S.projects||[]).find(x=>x.status!=='done');if(p)out.push({icon:'⌂',title:p.name,sub:'An active project you can move forward when you have room.',action:'Plan',fn:"go('plan');planTab('projects')"})}return out.slice(0,3)}
function focusTask(src,id){const arr=src==='oneoff'?oneoff:(daily[src]||[]),t=arr.find(x=>x.id===id);if(!t)return;if(src!=='today'&&!daily.today.some(x=>x.text===t.text)){daily.today.push({id:uid(),text:t.text,done:false});localStorage.setItem('nl_daily',JSON.stringify(daily));syncRaw('_daily',daily);toast('Added to Today')}else toast('Already in your day');renderAll()}
function renderForYou(){const a=forYou();return `<div class="section-kicker"><h2>For you</h2><span>from your life</span></div><div class="for-you">${a.length?a.map(x=>`<div class="fy-row"><div class="fy-icon">${x.icon}</div><div class="fy-copy"><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></div><button class="fy-action" onclick="${x.fn}">${x.action}</button></div>`).join(''):'<div class="empty">Nothing needs extra attention right now.</div>'}</div>`}
function renderResetCard(){const w=weeklyData(),sun=new Date().getDay()===0;return `<div class="section-kicker"><h2>Weekly direction</h2><span>${w.resetDone?'set for this week':sun?'Sunday reset':'your north star'}</span></div><div class="reset-card"><div class="reset-top"><div><div class="micro">${sun?'SUNDAY RESET':'THIS WEEK'}</div><h3>${w.resetDone?'Your week has a direction.':'Choose what deserves your energy.'}</h3><p>${w.resetDone?(w.note||'Keep the week focused without trying to improve everything at once.'):'Pick up to three areas. The app will use them to shape what it surfaces.'}</p></div></div>${w.priorities?.length?`<div class="priority-pills">${w.priorities.map(x=>`<span class="priority-pill">${esc(x)}</span>`).join('')}</div>`:''}<button class="reset-btn" onclick="openWeeklyReset()">${w.resetDone?'Adjust week':'Plan my week'}</button></div>`}
function openWeeklyReset(){const w=weeklyData(),opts=['Health','Family & adoption','Career','Home','Travel & plans','Me time'];openSheet('Weekly Reset',`<div class="note"><b>Pick up to three.</b> This is direction, not another checklist.</div><div class="sheet-section">What matters this week?</div>${opts.map(x=>`<label class="reset-choice ${w.priorities?.includes(x)?'on':''}"><input type="checkbox" class="week-priority" value="${x}" ${w.priorities?.includes(x)?'checked':''} onchange="this.closest('.reset-choice').classList.toggle('on',this.checked)"><div><b>${x}</b></div></label>`).join('')}<div class="sheet-section">A note to yourself</div><input id="week-note" class="reset-note" placeholder="What would make this week feel good?" value="${esc(w.note||'')}"><button class="reset-btn" style="background:var(--purple);color:#fff;width:100%" onclick="saveWeeklyReset()">Set my week</button>`)}
function saveWeeklyReset(){let picks=[...document.querySelectorAll('.week-priority:checked')].map(x=>x.value).slice(0,3);v4.weekly[weekKey()]={priorities:picks,note:document.getElementById('week-note')?.value||'',resetDone:true};saveV4();closeSheet();renderAll();toast('Week set')}
function healthJourneyHTML(){const days=last7(),counts=Object.fromEntries(HABITS.map(h=>[h.id,days.filter(x=>habitOn(h.id,x.s)).length])),score=days.reduce((n,x)=>n+habitScore(x.s),0),weight=metricVal('Weight'),goal=metricVal('Goal weight'),d=v4.doctor||{};let msg=score>=28?'Strong consistency this week. Keep it sustainable.':score>=16?'You are building consistency — small choices are stacking up.':'Start small. One or two repeatable choices are enough to build from.';return `<div class="health-hero"><div class="health-hero-top"><div><div class="health-small">YOUR HEALTH JOURNEY</div><div class="health-big">${score}<span style="font-size:15px;font-weight:600"> / 42</span></div></div><div class="doctor-status">7-day view</div></div><div class="health-msg">${msg}</div><div class="journey"><div><b>${counts.movement}/7</b><span>movement</span></div><div><b>${counts.alcohol}/7</b><span>alcohol plan</span></div><div><b>${counts.nutrition}/7</b><span>nutrition</span></div></div></div><div class="group">${HABITS.map(h=>`<div class="row tap" onclick="toggleHabit('${h.id}')"><div class="trend-icon">${h.emoji}</div><div class="row-copy"><div class="row-title">${h.name}</div><div class="row-sub">${h.note} · ${counts[h.id]}/7 this week</div></div><div class="rowcheck ${habitOn(h.id)?'done':''}">${habitOn(h.id)?'✓':''}</div></div>`).join('')}</div><div class="sheet-section">Weight direction</div><div class="mini-banner tap" onclick="editWeight()"><b>${weight??'—'}${weight?' lb':''} → ${goal??'—'} lb goal</b><p>Tap to update your current weight. The goal is the long-term trend, not daily fluctuations.</p></div><div class="sheet-section">Doctor nutrition & health program</div><div class="doctor-card"><div class="doctor-head"><b>${esc(d.program||'Program')}</b><span class="doctor-status">${esc(d.status||'Considering')}</span></div><p>${esc(d.notes||'Keep appointments, program goals, nutrition guidance and notes together when you enroll.')}</p><button onclick="editDoctorProgram()">Update program</button></div>`}
function editDoctorProgram(){const status=prompt('Program status (Considering, Enrolled, Active, Complete)',v4.doctor?.status||'Considering');if(status===null)return;const program=prompt('Program name (optional)',v4.doctor?.program||'');if(program===null)return;const notes=prompt('Program notes / current focus',v4.doctor?.notes||'');if(notes===null)return;v4.doctor={status:status.trim()||'Considering',program:program.trim(),notes:notes.trim()};saveV4();renderAll();showLife('health');toast('Health program updated')}
function renderNow(){const pool=taskPool(),undone=pool.filter(t=>!t.done),allday=allDay(),done=allday.filter(t=>t.done).length,next=nextTrips()[0],score=habitScore(),h=new Date().getHours();const shown=undone.slice(0,4);document.getElementById('screen-now').innerHTML=`
<div class="mast"><div class="mast-row"><div><div class="micro">${fmtDate(new Date())}</div><div class="greeting">${dayGreeting()}, Nick.</div><div class="mast-copy">${h>=19?'Finish the day gently. A few good choices are enough.':h<12?'Start with what matters — the rest can wait.':'Keep the day moving without carrying everything at once.'}</div><div class="sync-mini"><span class="sync-dot ${syncState==='synced'?'ok':syncState==='syncing'?'busy':syncState==='error'?'bad':''}"></span><span class="sync-label">${syncState==='synced'?'Synced':syncState==='syncing'?'Syncing…':syncState==='error'?'Sync issue':'Offline'}</span></div></div><div class="avatar tap" onclick="showAbout()">NB</div></div></div>
<div class="home-wrap">
${next?`<div class="upnext tap" onclick="showTrip('${next.id}')"><div class="event-icon">✈️</div><div class="up-copy"><div class="up-label">Up next</div><div class="up-title">${esc(next.title)}</div><div class="up-sub">${esc(next.location||'Plans')} · ${daysAway(next.date)===0?'today':daysAway(next.date)===1?'tomorrow':daysAway(next.date)+' days away'}</div></div><div class="arrow">›</div></div>`:''}
<div class="section-kicker"><h2>${phase()}</h2><span>${undone.length} things open</span></div>
<div class="tonight"><div class="tonight-head"><div class="tonight-title">What matters now</div><div class="time-pill">${phase()}</div></div>${shown.length?shown.map(t=>`<div class="priority"><button class="pcheck ${t.done?'done':''}" onclick="toggleTask('${t._src}','${t.id}')">${t.done?'✓':''}</button><div class="txt ${t.done?'done':''}">${esc(t.text)}</div></div>`).join(''):'<div class="empty-dark">Nothing urgent. Enjoy the breathing room.</div>'}<button class="more-link" onclick="go('plan')">See the full plan →</button><div class="quickline"><input id="quick-task" placeholder="Add something for today" onkeydown="if(event.key==='Enter')addToday()"><button onclick="addToday()">Add</button></div></div>
<div class="section-kicker"><h2>Your day</h2><span>progress, not pressure</span></div><div class="daybar"><div class="daystat"><b>${done}</b><span>tasks done</span></div><div class="daystat"><b>${score}/6</b><span>health choices</span></div><div class="daystat"><b>${next?daysAway(next.date):'—'}</b><span>${next?'days to '+esc(next.title).split(' ')[0]:'next event'}</span></div></div>
${renderForYou()}${renderResetCard()}<div class="section-kicker"><h2>Health today</h2><span>tap what counts</span></div><div class="wellstrip">${HABITS.map(x=>`<div class="wellchip tap ${habitOn(x.id)?'active':''}" onclick="toggleHabit('${x.id}')"><div class="well-top"><div class="well-emoji">${x.emoji}</div><div class="mini-check">${habitOn(x.id)?'✓':''}</div></div><div class="well-name">${x.name}</div><div class="well-note">${x.note}</div></div>`).join('')}</div>
</div>`}
function lightHeader(title,sub){return `<div class="light-head"><div class="head-small">Nick Life</div><div class="head-title">${title}</div><div class="head-sub">${sub}</div></div>`}
function renderLife(){const active=(S.projects||[]).filter(p=>p.status!=='done').length,goals=S.career?.goals?.length||0;document.getElementById('screen-life').innerHTML=lightHeader('Life','Everything important has a home — without crowding your Today screen.')+`<div class="space-list"><div class="space health tap" onclick="showLife('health')"><div class="space-icon">♥</div><div class="space-row"><div><h3>Health & Me</h3><p>Nutrition, movement, alcohol, vaping, weight, self-care and your doctor program.</p></div><div class="space-stat">${habitScore()}/6 today</div></div></div><div class="space family tap" onclick="showLife('family')"><div class="space-icon">⌂</div><div class="space-row"><div><h3>Family & Adoption</h3><p>Your reason for the lifestyle shift, preparation, paperwork and shared plans.</p></div><div class="space-stat">North star</div></div></div><div class="space home tap" onclick="showLife('home')"><div class="space-icon">▦</div><div class="space-row"><div><h3>Home</h3><p>Projects, rooms, garden, maintenance and future ideas.</p></div><div class="space-stat">${active} active</div></div></div><div class="space career tap" onclick="showLife('career')"><div class="space-icon">↗</div><div class="space-row"><div><h3>Career</h3><p>Wins, learning, goals and the next version of your work life.</p></div><div class="space-stat">${goals} goals</div></div></div><div class="space time tap" onclick="showLife('hobbies')"><div class="space-icon">✦</div><div class="space-row"><div><h3>My Time</h3><p>Games, music, reading, gardening and birds — the parts that make life yours.</p></div><div class="space-stat">${(S.hobbies||[]).length} hobbies</div></div></div><div class="space experience tap" onclick="showLife('experiences')"><div class="space-icon">◎</div><div class="space-row"><div><h3>Experiences</h3><p>Trips, concerts, weddings, games and everything on the calendar worth anticipating.</p></div><div class="space-stat">${nextTrips().length} upcoming</div></div></div></div>`}
function planTab(id){activePlan=id;renderPlan()}function renderPlan(){const tabs=[['tasks','Tasks'],['projects','Projects'],['trips','Trips'],['reminders','Reminders']];document.getElementById('screen-plan').innerHTML=lightHeader('Plan','The things that need a place, but not necessarily your attention right now.')+`<div class="segment">${tabs.map(([i,l])=>`<button class="seg ${activePlan===i?'active':''}" onclick="planTab('${i}')">${l}</button>`).join('')}</div><div class="plan-body">${activePlan==='tasks'?planTasks():activePlan==='projects'?planProjects():activePlan==='trips'?planTrips():planReminders()}</div>`}
function planTasks(){const groups=[['Morning',daily.morning||[],'morning'],['Today',daily.today||[],'today'],['Afternoon',daily.afternoon||[],'afternoon'],['Evening',daily.evening||[],'evening']];let h=groups.map(([name,arr,src])=>`<div class="section-kicker"><h2>${name}</h2><span>${arr.filter(x=>x.done).length}/${arr.length}</span></div><div class="group">${arr.length?arr.map(t=>`<div class="row"><button class="rowcheck ${t.done?'done':''}" onclick="toggleTask('${src}','${t.id}')">${t.done?'✓':''}</button><div class="row-copy"><div class="row-title ${t.done?'done':''}">${esc(t.text)}</div></div></div>`).join(''):'<div class="empty">Nothing here.</div>'}</div>`).join('');const oo=[...(oneoff||[]),...(S.notesTasks||[])].filter(t=>!t.done);h+=`<div class="section-kicker"><h2>To-dos</h2><span>${oo.length} open</span></div><div class="group">${oo.length?oo.map(t=>`<div class="row"><button class="rowcheck" onclick="toggleOneOffCompat('${t.id}')"></button><div class="row-copy"><div class="row-title">${esc(t.text)}</div></div></div>`).join(''):'<div class="empty">All clear.</div>'}</div>`;return h}
function toggleOneOffCompat(id){let t=oneoff.find(x=>x.id===id);if(t){t.done=!t.done;localStorage.setItem('nl_oneoff',JSON.stringify(oneoff));syncRaw('_oneoff',oneoff)}else{t=(S.notesTasks||[]).find(x=>x.id===id);if(t){t.done=!t.done;localStorage.setItem('nl_notes_tasks',JSON.stringify(S.notesTasks));syncRaw('_notesTasks',S.notesTasks)}}renderAll()}
function planProjects(){const p=S.projects||[];return `<div class="section-kicker"><h2>Projects</h2><span>${p.filter(x=>x.status!=='done').length} active</span></div><div class="group">${p.length?p.map(x=>`<div class="row"><span class="project-dot ${x.status==='hold'?'hold':x.status==='done'?'done':''}"></span><div class="row-copy"><div class="row-title">${esc(x.name)}</div>${x.notes?`<div class="row-sub">${esc(x.notes).split('\n')[0]}</div>`:''}</div><span class="badge">${esc(x.status||'active')}</span></div>`).join(''):'<div class="empty">No projects.</div>'}</div>`}
function planTrips(){const a=(S.trips||[]).slice().sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999'));return `<div class="section-kicker"><h2>Trips & events</h2><span>${a.length} total</span></div><div class="group">${a.length?a.map(t=>{let d=t.date?new Date(t.date+'T12:00:00'):null;return`<div class="row tap" onclick="showTrip('${t.id}')"><div class="event-icon" style="width:38px;height:38px;border-radius:12px">${t.type==='wedding'?'💍':t.type==='event'?'🎟️':'✈️'}</div><div class="row-copy"><div class="row-title">${esc(t.title)}</div><div class="row-sub">${d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'Date TBD'} · ${esc(t.location||'Location TBD')}</div></div><div class="arrow">›</div></div>`}).join(''):'<div class="empty">No trips.</div>'}</div>`}
function planReminders(){return `<div class="section-kicker"><h2>Reminders</h2><span>${(S.reminders||[]).length}</span></div><div class="group">${(S.reminders||[]).length?(S.reminders||[]).map(r=>`<div class="row"><span class="project-dot" style="background:${esc(r.color||'#999')}"></span><div class="row-copy"><div class="row-title">${esc(r.title)}</div><div class="row-sub">${esc(r.due||'No due date')}</div></div></div>`).join(''):'<div class="empty">No reminders.</div>'}</div>`}
function metricVal(name){const m=(S.metrics||[]).find(x=>x.name?.toLowerCase()===name.toLowerCase());return m?Number(String(m.value).replace(/[^0-9.]/g,'')):null}function last7(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push({d,s:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})}return a}
function renderProgress(){const days=last7(),weekly=days.reduce((n,x)=>n+habitScore(x.s),0),max=42,p=Math.round(weekly/max*100),weight=metricVal('Weight'),goal=metricVal('Goal weight');const wp=weight&&goal?Math.max(4,Math.min(100,100-((weight-goal)/(Math.max(weight,goal)-goal||1)*100))):0;document.getElementById('screen-progress').innerHTML=lightHeader('Progress','Look for direction across weeks — not perfect days.')+`<div class="progress-hero"><div class="ph-label">This week</div><div class="ringrow"><div class="ring" style="--p:${p}"><div class="ringtext">${p}%</div></div><div><div class="ph-number">${weekly}</div><div class="ph-sub">positive lifestyle choices logged</div><div class="ringsummary">Movement, nutrition, drinking less, vaping less, hydration and recovery all count toward the same bigger shift.</div></div></div></div><div class="progress-body"><div class="section-kicker"><h2>Last 7 days</h2><span>${weekly}/${max} choices</span></div><div class="week">${days.map(x=>{const s=habitScore(x.s),ht=Math.max(8,Math.round(s/6*100));return`<div class="wday"><div class="wname">${x.d.toLocaleString('en-US',{weekday:'narrow'})}</div><div class="wscore ${x.s===todayStr()?'today':''}"><i style="height:${ht}%"></i><b>${s}</b></div></div>`}).join('')}</div><div class="section-kicker"><h2>Health trends</h2><span>this week</span></div><div class="group">${HABITS.map(h=>{const n=days.filter(x=>habitOn(h.id,x.s)).length;return`<div class="trend"><div class="trend-icon">${h.emoji}</div><div class="trend-copy"><b>${h.name}</b><span>${h.note}</span></div><div class="trend-val">${n}/7</div></div>`}).join('')}</div><div class="section-kicker"><h2>Weight</h2><span>long-term trend</span></div><div class="weightbox tap" onclick="editWeight()"><div class="weightrow"><div><span>Current</span><b>${weight??'—'}${weight?' lb':''}</b></div><div><span>Goal ${goal??'—'} lb · tap to update</span></div></div><div class="weightbar"><div style="width:${wp}%"></div></div></div><div class="section-kicker"><h2>Career momentum</h2><span>${S.career?.wins?.length||0} wins saved</span></div><div class="group">${(S.career?.wins||[]).slice(-4).map(w=>`<div class="row"><div class="rowcheck done">✓</div><div class="row-copy"><div class="row-title">${esc(w.text)}</div></div></div>`).join('')||'<div class="empty">No wins saved yet.</div>'}</div></div>`}
function editWeight(){const n=prompt('Current weight',metricVal('Weight')??'');if(n===null||!n.trim())return;let m=(S.metrics||[]).find(x=>x.name?.toLowerCase()==='weight');if(!m){m={id:uid(),name:'Weight',value:n};S.metrics.push(m)}else m.value=n;localStorage.setItem('nl_metrics',JSON.stringify(S.metrics));syncRaw('metrics',S.metrics);renderAll();toast('Weight updated')}
function showTrip(id){const t=(S.trips||[]).find(x=>x.id===id);if(!t)return;openSheet(t.title,`<div class="group"><div class="row"><div class="row-copy"><div class="row-sub">Dates</div><div class="row-title">${esc(t.date||'TBD')}${t.endDate?' – '+esc(t.endDate):''}</div></div></div><div class="row"><div class="row-copy"><div class="row-sub">Location</div><div class="row-title">${esc(t.location||'TBD')}</div></div></div><div class="row"><div class="row-copy"><div class="row-sub">Who</div><div class="row-title">${esc(t.who||'—')}</div></div></div></div>${t.notes?`<div class="sheet-section">Notes</div><div class="note">${esc(t.notes).replace(/\n/g,'<br>')}</div>`:''}${(t.packing||[]).length?`<div class="sheet-section">Packing</div><div class="group">${t.packing.map(p=>`<div class="row"><div class="rowcheck ${p.done?'done':''}">${p.done?'✓':''}</div><div class="row-copy"><div class="row-title ${p.done?'done':''}">${esc(p.text)}</div></div></div>`).join('')}</div>`:''}`)}
function showLife(type){if(type==='health'){openSheet('Health & Me',healthJourneyHTML())}else if(type==='family'){openSheet('Family & Adoption',`<div class="note"><b>North star:</b> build a healthier, steadier life that supports the family you want to grow.</div><div class="sheet-section">Foundation</div><div class="group"><div class="row"><div class="trend-icon">♥</div><div class="row-copy"><div class="row-title">Health & lifestyle</div><div class="row-sub">Create routines you can sustain as a parent</div></div></div><div class="row"><div class="trend-icon">⌂</div><div class="row-copy"><div class="row-title">Home & routines</div><div class="row-sub">Build a home life with structure and room for family</div></div></div><div class="row"><div class="trend-icon">✓</div><div class="row-copy"><div class="row-title">Adoption process</div><div class="row-sub">Documents, learning, appointments and milestones can live here next</div></div></div></div>`)}else if(type==='home'){openSheet('Home',planProjects())}else if(type==='career'){openSheet('Career',`<div class="sheet-section">Wins</div><div class="group">${(S.career?.wins||[]).map(w=>`<div class="row"><div class="rowcheck done">✓</div><div class="row-copy"><div class="row-title">${esc(w.text)}</div></div></div>`).join('')}</div><div class="sheet-section">Goals</div><div class="group">${(S.career?.goals||[]).map(g=>`<div class="row"><div class="rowcheck"></div><div class="row-copy"><div class="row-title">${esc(g.text)}</div></div></div>`).join('')}</div>`)}else if(type==='hobbies'){openSheet('My Time',`<div class="group">${(S.hobbies||[]).map(h=>`<div class="row"><div class="trend-icon">${esc(h.emoji||'✦')}</div><div class="row-copy"><div class="row-title">${esc(h.name)}</div><div class="row-sub">${(h.subs||[]).filter(x=>!x.done).length} ideas waiting</div></div></div>`).join('')}</div>`)}else{openSheet('Experiences',planTrips())}}
function openSheet(title,html){document.getElementById('sheet-title').textContent=title;document.getElementById('sheet-body').innerHTML=html;document.getElementById('sheet').classList.add('show')}function closeSheet(){document.getElementById('sheet').classList.remove('show')}function showAbout(){openSheet('Nick Life',`<div class="note">This is Nick Life V4 — with For You, Weekly Reset, and a Health Journey built into the redesigned interface. It reads and writes your existing <b>nl_sync</b> Supabase data while keeping the original app intact.</div><div class="sheet-section">Design</div><div class="group"><div class="row"><div class="row-copy"><div class="row-title">Adaptive Today</div><div class="row-sub">What matters changes with the time of day.</div></div></div><div class="row"><div class="row-copy"><div class="row-title">Life spaces</div><div class="row-sub">Health, family, home, career and fun each have a home.</div></div></div><div class="row"><div class="row-copy"><div class="row-title">Progress over perfection</div><div class="row-sub">Weekly trends matter more than a perfect checklist.</div></div></div></div>`)}
function renderAll(){if(!v2.days)v2.days={};if(!v2.days[todayStr()])v2.days[todayStr()]={};renderNow();renderLife();renderPlan();renderProgress()}
renderAll();initSupabase();
</script>
